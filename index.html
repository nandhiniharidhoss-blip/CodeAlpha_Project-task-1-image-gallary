<body>

<header>
    <h1>🌍 Amazing Image Gallery</h1>
    <p>Animals • Birds • Flowers • Nature • Insects</p>

    <input
    type="text"
    id="search"
    placeholder="🔍 Search Image..."
    onkeyup="searchImages()">

<div class="buttons">
    <button onclick="filterGallery('all')">All</button>
    <button onclick="filterGallery('animal')">Animals</button>
    <button onclick="filterGallery('bird')">Birds</button>
    <button onclick="filterGallery('flower')">Flowers</button>
    <button onclick="filterGallery('nature')">Nature</button>
    <button onclick="filterGallery('insect')">Insects</button>
</div>

<!-- Lightbox Modal Container with Cancel (Close), Previous, and Next buttons -->
<div id="lightbox" class="lightbox" onclick="if(event.target==this) closeLightbox();">
    <span class="close" onclick="event.stopPropagation(); closeLightbox();">&times;</span>
    <button class="prev" onclick="event.stopPropagation(); prevImage();">&#10094;</button>
    <img id="lightbox-img" alt="Preview Image" onclick="event.stopPropagation();">
    <button class="next" onclick="event.stopPropagation(); nextImage();">&#10095;</button>
</div>
